name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install Node dependencies
        run: npm ci
      - name: Validate Apify Actor Schemas
        run: npx --yes apify-cli@latest validate-schema
      - name: Validate MCPize Manifest
        run: npx --yes mcpize@latest doctor --manifest
      - name: Run Automated Cryptographic, Security & MCP Test Suite
        run: npm test
